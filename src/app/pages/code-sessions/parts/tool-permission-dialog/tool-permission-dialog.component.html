@if (pendingToolUse) {
<mat-card class="permission-dialog">
    <mat-card-header>
        <div class="avatar-icon">
            <mat-icon>security</mat-icon>
        </div>
        <mat-card-title>ツール実行の許可</mat-card-title>
        <mat-card-subtitle>
            <mat-icon class="tool-icon">{{ getToolIcon(pendingToolUse.name) }}</mat-icon>
            <span>{{ pendingToolUse.name }}</span>
            を実行しますか？
        </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
        <div class="input-section">
            <div class="section-label">入力パラメータ</div>
            <pre class="tool-input-preview">{{ pendingToolUse.input | json }}</pre>
        </div>
    </mat-card-content>
    <mat-card-actions align="end">
        <button mat-button color="warn" (click)="onReject()">
            <mat-icon>close</mat-icon>
            拒否 (Esc)
        </button>
        <button mat-raised-button color="primary" (click)="onApprove()">
            <mat-icon>check</mat-icon>
            許可 (1)
        </button>
    </mat-card-actions>
</mat-card>
}
