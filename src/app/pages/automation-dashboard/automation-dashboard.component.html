<section class="automation-dashboard">
  <header class="header">
    <div class="logo"><i class="fa-solid fa-robot"></i> Automation Dashboard</div>
    <nav class="nav">
      <button type="button" class="nav-link" routerLink="dashboard" routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        ダッシュボード
      </button>
      <button type="button" class="new-job-btn" (click)="openModal()">
        <i class="fa-solid fa-plus"></i> 新規ジョブ作成
      </button>
    </nav>
  </header>

  <main class="container">
    <router-outlet></router-outlet>
  </main>

  @if(modalOpen()){
  <div class="modal-overlay" (click)="closeModal(true)">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <button type="button" class="modal-close-btn" (click)="closeModal(true)">&times;</button>
      <h2><i class="fa-solid fa-rocket"></i> 新規オートメーション ジョブ</h2>

      <form (submit)="submitJob($event)">
        <div class="form-group">
          <label for="job-project">プロジェクト</label>
          <select id="job-project" name="jobProject" [ngModel]="jobForm.projectId"
            (ngModelChange)="onProjectChange($event)">
            <option value="" disabled>プロジェクトを選択</option>
            @for(project of projects();track project.id){
            <option [value]="project.id">{{ project.name }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="job-name">ジョブ名</label>
          <input type="text" id="job-name" name="jobName" [(ngModel)]="jobForm.name" placeholder="例: 顧客レビュー感情分析 (6月)"
            required>
        </div>

        <div class="form-group">
          <label for="job-description">説明 (任意)</label>
          <textarea id="job-description" name="jobDescription" [(ngModel)]="jobForm.description"
            placeholder="ジョブの目的や入力データの概要を記載してください"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="job-trigger">トリガー</label>
            <select id="job-trigger" name="jobTrigger" [ngModel]="jobForm.trigger"
              (ngModelChange)="onTriggerChange($event)">
              <option value="manual">手動実行</option>
              <option value="schedule">スケジュール実行</option>
            </select>
          </div>
          @if(jobForm.trigger === 'schedule'){
          <div class="form-group">
            <label for="schedule-cron">Cron</label>
            <input type="text" id="schedule-cron" name="scheduleCron" [(ngModel)]="jobForm.schedule!.cron"
              placeholder="0 3 * * *">
          </div>
          }
          @if(jobForm.trigger === 'schedule'){
          <div class="form-group">
            <label for="schedule-tz">タイムゾーン</label>
            <input type="text" id="schedule-tz" name="scheduleTimezone" [(ngModel)]="jobForm.schedule!.timezone"
              placeholder="Asia/Tokyo">
          </div>
          }
        </div>

        <hr>

        <h3>AI タスク設定</h3>
        <div class="form-group">
          <label for="ai-model">使用モデル</label>
          <app-model-selector class="model-selector-field" name="ai-model" [args]="modelArgs()"
            (argsChange)="onModelChange($event)" [opened]="modalOpen()"
            (click)="$event.stopPropagation();$event.preventDefault()"></app-model-selector>
          <small class="selected-model-note">選択中: {{ jobForm.providerName }} / {{ jobForm.model }}</small>
        </div>

        <div class="form-group">
          <label for="prompt-template">プロンプトテンプレート</label>
          <textarea id="prompt-template" name="promptTemplate" [(ngModel)]="jobForm.promptTemplate"
            placeholder="以下の文章を要約してください。" rows="6"></textarea>
          <small>入力データの列名は <code>{{'{{column_name}}'}}</code> の形式で参照できます。</small>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="parallel-exec">並列実行数</label>
            <input type="number" id="parallel-exec" name="parallelExec" min="1" [(ngModel)]="jobForm.parallelism">
          </div>
          <div class="form-group">
            <label for="retry-count">リトライ回数</label>
            <input type="number" id="retry-count" name="retryCount" min="0" [(ngModel)]="jobForm.retryLimit">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="input-source">入力ソース</label>
            <select id="input-source" name="inputSource" [(ngModel)]="jobForm.input!.source">
              <option value="upload">ファイルアップロード</option>
              <option value="dataset">データセット</option>
              <option value="api">外部API</option>
            </select>
          </div>
          @if(jobForm.input!.source === 'upload'){
          <div class="form-group">
            <label for="input-file">ファイルID (任意)</label>
            <input type="text" id="input-file" name="inputFileId" [(ngModel)]="jobForm.input!.fileId"
              placeholder="file_123">
          </div>
          }
        </div>

        <div class="form-actions">
          <button type="button" class="btn-secondary" (click)="closeModal(true)">
            キャンセル
          </button>
          <button type="submit" class="btn-primary" [disabled]="creatingJob()">
            <i class="fa-solid fa-paper-plane"></i>
            {{ creatingJob() ? '作成中...' : 'ジョブを作成' }}
          </button>
        </div>
      </form>
    </div>
  </div>
  }
</section>
