<div [matMenuTriggerFor]="userMenu" class="cursor-pointer container" >
    <div class="mobile-user-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="8" r="3" stroke="currentColor" stroke-width="2" />
            <path d="M12 14c-4 0-7 2-7 5v1h14v-1c0-3-3-5-7-5z" stroke="currentColor" stroke-width="2" />
        </svg>
    </div>
    <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="openHistory()">
            <mat-icon>browse_activity</mat-icon>
            <span>{{ 'USAGE_HISTORY' | translate }}</span>
        </button>
        <button mat-menu-item (click)="openUserSetting()">
            <mat-icon>settings</mat-icon>
            <span>{{ 'SETTINGS' | translate }}</span>
        </button>
        <button mat-menu-item (click)="openApiKeyManager()">
            <mat-icon>key</mat-icon>
            <span>{{ 'API_KEY_MANAGEMENT' | translate }}</span>
        </button>

        <button mat-menu-item [matMenuTriggerFor]="legalMenu">
            <mat-icon>description</mat-icon>
            <span>{{ 'APP_INFO' | translate }}</span>
        </button>
        <mat-menu #legalMenu="matMenu">
            <a mat-menu-item href="./static/terms-and-privacy/terms.html" target="_blank">
                <!-- <mat-icon>gavel</mat-icon> -->
                <span>{{ 'TERMS_OF_SERVICE' | translate }}</span>
                <mat-icon>open_in_new</mat-icon>
            </a>
            <a mat-menu-item href="./static/terms-and-privacy/privacy.html" target="_blank">
                <!-- <mat-icon>privacy_tip</mat-icon> -->
                <span>{{ 'PRIVACY_POLICY' | translate }}</span>
                <mat-icon>open_in_new</mat-icon>
            </a>
            <button mat-menu-item (click)="openLicenseViewer()">
                <mat-icon>article</mat-icon>
                <span>{{ 'LICENSE_INFORMATION' | translate }}</span>
            </button>
        </mat-menu>

        <mat-divider></mat-divider>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="authService.logout()">
            <mat-icon>logout</mat-icon>
            <span>{{ 'LOGOUT' | translate }}</span>
        </button>
    </mat-menu>
    <div class="email overflow-hidden overflow-ellipsis" [title]="g.info.user.email">{{g.info.user.email}}</div>
</div>
